name: Document AI Python validation

on:
  pull_request:
    paths:
      - 'document-ai/**'
      - '.github/workflows/document-ai-python-validation.yml'
  push:
    branches:
      - 'feature/document-ai-v41-readable-results-20261110'
      - 'feature/document-ai-v42-evidence-fields-20261111'
    paths:
      - 'document-ai/**'
      - '.github/workflows/document-ai-python-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-ai
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: document-ai/requirements.txt
      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-msa tesseract-ocr-tam tesseract-ocr-chi-sim
          tesseract --version
          tesseract --list-langs
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Document AI Python modules
        run: python -m compileall -q app tests
      - name: Run all Document AI tests
        run: python -m pytest -q tests
