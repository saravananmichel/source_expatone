name: Phase 3.3 Friends and Family verification
on:
  push:
    branches:
      - feature/phase3.3-friends-family-reminders
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run backend tests
        run: dotnet test src/backend/ExpatOne.Tests/ExpatOne.Tests.csproj --configuration Release
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze Friends and Family
        run: flutter analyze lib/features/family lib/core/services/family_service.dart
      - name: Build web
        run: flutter build web --release
