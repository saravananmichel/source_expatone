name: Phase 3.1 build verification

on:
  push:
    branches:
      - feature/phase3.1-offer-enhancements
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore backend
        run: dotnet restore src/backend/ExpatOne.Api/ExpatOne.Api.csproj
      - name: Build backend
        run: dotnet build src/backend/ExpatOne.Api/ExpatOne.Api.csproj --configuration Release --no-restore

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze corporate feature
        run: flutter analyze lib/features/corporate lib/core/services/corporate_service.dart lib/core/networking/api_client.dart
      - name: Build web
        run: flutter build web --release
