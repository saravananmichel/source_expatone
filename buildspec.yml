version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail

        # All three images will target Linux/X86_64.
        test "$(uname -m)" = "x86_64" || {
          echo "Use an x86_64 Linux CodeBuild environment."
          exit 1
        }

        export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        export ECR_REGION=ap-southeast-1
        export REGISTRY="$ACCOUNT_ID.dkr.ecr.$ECR_REGION.amazonaws.com"
        export IMAGE_TAG="$CODEBUILD_RESOLVED_SOURCE_VERSION"

        aws ecr get-login-password --region "$ECR_REGION" |
          docker login --username AWS --password-stdin "$REGISTRY"

        cd "$CODEBUILD_SRC_DIR"
        test -f src/backend/Dockerfile
        test -f document-ai/Dockerfile
        test -f document-ai/Dockerfile.ollama
        test -f document-ai/requirements.txt

  build:
    commands:
      - |
        set -euo pipefail
        cd "$CODEBUILD_SRC_DIR"

        echo "Running backend tests..."
        docker run --rm --platform linux/amd64 \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -v "$CODEBUILD_SRC_DIR/src/backend:/src" \
          -w /src \
          mcr.microsoft.com/dotnet/sdk:8.0 \
          dotnet test ExpatOne.Tests/ExpatOne.Tests.csproj \
          --configuration Release --verbosity minimal

        echo "Building .NET API..."
        docker build --platform linux/amd64 \
          -t "$REGISTRY/expatone-api:$IMAGE_TAG" \
          ./src/backend

        echo "Building Python document service..."
        docker build --platform linux/amd64 \
          -t "$REGISTRY/expatone-document-ai:$IMAGE_TAG" \
          ./document-ai

        echo "Running visa PDF tests..."
        docker run --rm --platform linux/amd64 \
          -e PYTHONPATH=/service \
          -v "$CODEBUILD_SRC_DIR/document-ai/tests:/tests:ro" \
          -w /service \
          "$REGISTRY/expatone-document-ai:$IMAGE_TAG" \
          python -m pytest /tests/test_visa_forms.py -q -p no:cacheprovider

        echo "Building Ollama with qwen3:4b..."
        docker build --platform linux/amd64 \
          -f document-ai/Dockerfile.ollama \
          -t "$REGISTRY/expatone-ollama:$IMAGE_TAG" \
          ./document-ai

  post_build:
    commands:
      - |
        set -euo pipefail

        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Build failed; skipping image pushes."
          exit 1
        fi

        for REPO_NAME in expatone-api expatone-document-ai expatone-ollama; do
          docker push "$REGISTRY/$REPO_NAME:$IMAGE_TAG"
        done

        echo "Image URIs for ECS:"
        echo "$REGISTRY/expatone-api:$IMAGE_TAG"
        echo "$REGISTRY/expatone-document-ai:$IMAGE_TAG"
        echo "$REGISTRY/expatone-ollama:$IMAGE_TAG"