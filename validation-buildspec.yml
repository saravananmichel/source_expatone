version: 0.2

env:
  shell: bash

phases:
  build:
    commands:
      - |
        set -euo pipefail

        echo "=== Confirm x86_64 build environment ==="
        test "$(uname -m)" = "x86_64"

        echo "=== Run backend tests ==="
        docker run --rm --platform linux/amd64 \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -v "$CODEBUILD_SRC_DIR/src/backend:/src" \
          -w /src \
          mcr.microsoft.com/dotnet/sdk:8.0 \
          dotnet test ExpatOne.Tests/ExpatOne.Tests.csproj \
          --configuration Release --verbosity minimal

        echo "=== Build API image locally in CodeBuild ==="
        docker build --platform linux/amd64 \
          -t expatone-api-validation:"$CODEBUILD_RESOLVED_SOURCE_VERSION" \
          ./src/backend

        echo "=== Verify API image exists ==="
        docker image inspect \
          expatone-api-validation:"$CODEBUILD_RESOLVED_SOURCE_VERSION" \
          --format 'API image built successfully: {{.Id}}'

        echo "=== Validation complete; no image was pushed ==="
