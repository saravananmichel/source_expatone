version: 0.2

phases:
  install:
    commands:
      - echo "Installing Flutter stable SDK"
      - git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /tmp/flutter
      - /tmp/flutter/bin/flutter --version
      - /tmp/flutter/bin/flutter config --enable-web

  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/src/mobile" && /tmp/flutter/bin/flutter pub get

  build:
    commands:
      - test -n "$FIREBASE_API_KEY" && test -n "$FIREBASE_AUTH_DOMAIN" && test -n "$FIREBASE_PROJECT_ID" && test -n "$FIREBASE_STORAGE_BUCKET" && test -n "$FIREBASE_MESSAGING_SENDER_ID" && test -n "$FIREBASE_APP_ID"
      - cd "$CODEBUILD_SRC_DIR/src/mobile" && /tmp/flutter/bin/flutter build web --release --base-href=/staging/site/ --dart-define=API_BASE_URL=https://d38i3e3pvvjux7.cloudfront.net/api --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
      - test -s "$CODEBUILD_SRC_DIR/src/mobile/build/web/index.html"
      - test -s "$CODEBUILD_SRC_DIR/src/mobile/build/web/main.dart.js"
      - grep -Fq 'd38i3e3pvvjux7.cloudfront.net/api' "$CODEBUILD_SRC_DIR/src/mobile/build/web/main.dart.js"
      - echo "Build and API URL verification passed"
      - echo "Uploading verified assets to staging only"
      - aws s3 sync "$CODEBUILD_SRC_DIR/src/mobile/build/web/" "s3://expatone-my-dev/staging/site/" --region ap-southeast-5 --only-show-errors
      - echo "Staging upload complete; live /web prefix unchanged"
