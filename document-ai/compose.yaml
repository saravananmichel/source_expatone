services:
  ollama:
    image: ollama/ollama:0.35.0
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - models:/root/.ollama
    # Internal network only. GPU hosts must add their runtime/device configuration.
    mem_limit: 8g
  document-ai:
    build: .
    environment:
      DOCUMENT_AI_SERVICE_KEY: ${DOCUMENT_AI_SERVICE_KEY:?Set a service key}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
    ports:
      - '127.0.0.1:8090:8090'
    depends_on:
      - ollama
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  models:
