# Manual Cloud Build validation for Document AI feature branches.
# This configuration runs tests only; it does not build, push or deploy a service.
steps:
  - id: document-ai-ocr-regression
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -euc
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          tesseract-ocr libgl1 libglib2.0-0t64 tesseract-ocr-eng tesseract-ocr-msa \
          tesseract-ocr-tam tesseract-ocr-chi-sim
        python -m pip install --no-cache-dir -r document-ai/requirements.txt
        tesseract --version
        python -m pip check
        python -c "from rapidocr_onnxruntime import RapidOCR; RapidOCR(intra_op_num_threads=2, inter_op_num_threads=1); print('RapidOCR model initialization passed')"
        cd document-ai
        python -m pytest tests -q
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
